# Development overrides for local debugging and live reloading
services:
  db:
    ports:
      - "5432:5432"

  backend:
    volumes:
      - ./backend:/app
    environment:
      - DEBUG=true
      - ENVIRONMENT=development
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
