##
## Nginx configuration for E2EE Notes frontend.
## Serves the Vite-built static assets and proxies API requests to the backend.
##
## Security hardening:
## - Restrictive Content-Security-Policy allowing only self + wasm-unsafe-eval (for Argon2id Wasm)
## - HSTS, X-Frame-Options, X-Content-Type-Options
## - SPA fallback: all unknown paths serve index.html (React Router handles routing)
## - API reverse proxy to backend service
##

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Security headers ──────────────────────────────────────────────────
    # CSP: allow self + wasm-unsafe-eval (required for hash-wasm / Argon2id WebAssembly)
    # connect-src 'self' restricts XHR/fetch to same origin only — prevents key exfiltration
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self';" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    # Note: HSTS should only be set when HTTPS is active (behind a TLS terminating proxy in prod)
    # add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ── Static assets with long cache ─────────────────────────────────────
    # Vite includes content hashes in filenames, so aggressive caching is safe
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        gzip_static on;
    }

    # Favicons and manifest
    location /favicon.svg {
        expires 1d;
        add_header Cache-Control "public";
    }

    # ── API proxy to backend ───────────────────────────────────────────────
    # Forwards all /api requests to the FastAPI backend service
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Preserve cookies for session management
        proxy_pass_header Set-Cookie;

        # Timeouts — allow for slow Argon2id on server side (login)
        proxy_connect_timeout 30s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }

    # ── Health check endpoint ──────────────────────────────────────────────
    location /health {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # ── SPA fallback: React Router ─────────────────────────────────────────
    # Serve index.html for all non-file routes so React Router handles navigation
    location / {
        try_files $uri $uri/ /index.html;

        # index.html must not be cached — always revalidate to pick up new deploys
        add_header Cache-Control "no-store, no-cache, must-revalidate";
        expires 0;
    }

    # ── Disable access to hidden files ─────────────────────────────────────
    location ~ /\. {
        deny all;
        return 404;
    }

    # ── Compression ────────────────────────────────────────────────────────
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/wasm
        image/svg+xml;
}
